<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light">
  <title>Consize — rightsizing with a safety engine</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <header class="topbar">
    <div class="brand">
      <svg class="logo" viewBox="0 0 24 24" aria-hidden="true">
        <rect x="3" y="3" width="18" height="18" rx="4" fill="none" stroke="currentColor" stroke-width="2"/>
        <path d="M12 7v7m0 0l-3.5-3.5M12 14l3.5-3.5" fill="none" stroke="currentColor"
              stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
        <path d="M7 17h10" stroke="currentColor" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <span class="brand-name">Consize</span>
    </div>

    <nav class="nav" id="tabs" aria-label="Primary">
      <a class="tab active" data-view="dashboard" href="#/" aria-current="page">Dashboard</a>
      <a class="tab" data-view="recommendations" href="#/recommendations">Recommendations</a>
      <a class="tab" data-view="workloads" href="#/workloads">Workloads</a>
      <a class="tab" data-view="audit" href="#/audit">Audit</a>
    </nav>

    <div class="api-status" id="api-status" role="status">
      <span class="dot"></span><span class="api-status-text">checking…</span>
    </div>
  </header>

  <main>
    <section class="view" id="view-dashboard" data-view="dashboard">
      <!-- rendered by app.js -->
    </section>

    <section class="view" id="view-recommendations" data-view="recommendations" hidden>
      <!-- rendered by app.js -->
    </section>

    <section class="view" id="view-workloads" data-view="workloads" hidden>
      <!-- rendered by app.js -->
    </section>

    <section class="view" id="view-audit" data-view="audit" hidden>
      <!-- rendered by app.js -->
    </section>

    <section class="view" id="view-workload-detail" data-view="workloads" hidden>
      <!-- rendered by app.js -->
    </section>
  </main>

  <footer class="footer">
    <span class="footer-brand">Consize</span>
    <span class="footer-tag">the rightsizing loop with a safety engine — analyze · guarded apply · verify · auto-rollback · audit</span>
  </footer>

  <script src="api.js"></script>
  <script src="app.js"></script>
</body>
</html>
