apiVersion: batch/v1
kind: CronJob
metadata:
  name: consize-report
  namespace: consize-system
spec:
  # Monday 09:00 UTC. The binary exits cleanly when the admin toggle is off.
  schedule: "0 9 * * 1"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: Never
          serviceAccountName: consize-reader
          containers:
            - name: report
              image: consize/report:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: consize-store
                      key: database-url
                - name: CONSIZE_SLACK_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: consize-alerts
                      key: slack-webhook
                      optional: true
