# Consize REST API. Runs with the write identity (consize-writer,
# rbac.yaml): /recommendations/{id}/apply and rollback go through it,
# so the pod needs the least-privilege RoleBinding for every namespace
# it is allowed to touch (deployed per-namespace by the stack wiring).
#
# KUBECONFIG is deliberately not set: the client library falls back to
# the in-cluster config, so the ServiceAccount IS the write identity.
#
# Auth (ADR-037): production requires server-verified users and roles. Add
# CONSIZE_BOOTSTRAP_ADMIN through the consize-auth Secret for first install;
# the bootstrap admin is created only while the users table is empty.
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: consize-api
  namespace: consize-system
  labels:
    app: consize-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: consize-api
  template:
    metadata:
      labels:
        app: consize-api
    spec:
      serviceAccountName: consize-writer
      containers:
        - name: api
          image: consize/api:latest
          ports:
            - containerPort: 8080
          env:
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: consize-store
                  key: database-url
            - name: CONSIZE_AUTH_REQUIRED
              value: "true"
            # Keep aligned with verify-cronjob.yaml so /api/v1/system/status
            # reports the verifier's actual base production window. The
            # effective window scales by apply step number.
            - name: CONSIZE_VERIFY_WINDOW
              value: "1h"
            # Optional Slack secret used by the Alerting UI's "Send test" and
            # by stored contact-point configs that reference this env var.
            # The webhook value itself is never stored in Postgres.
            - name: CONSIZE_SLACK_WEBHOOK
              valueFrom:
                secretKeyRef:
                  name: consize-alerts
                  key: slack-webhook
                  optional: true
            # Optional GitHub token used by the IaC PR workflow. Store only
            # the env var name in Consize settings; the token value stays here.
            - name: CONSIZE_GITHUB_TOKEN
              valueFrom:
                secretKeyRef:
                  name: consize-github
                  key: token
                  optional: true
            # Manual cloud-waste scans from the UI use the same live provider
            # source as the costscan CronJob. Never point production at the
            # fixture source.
            - name: CONSIZE_COSTSCAN
              value: "gcp"
            - name: CONSIZE_GCP_PROJECT
              value: "devops-portfolio-prod"
            - name: GOOGLE_APPLICATION_CREDENTIALS
              value: /etc/consize-gcp/key.json
            - name: CONSIZE_BOOTSTRAP_ADMIN
              valueFrom:
                secretKeyRef:
                  name: consize-auth
                  key: bootstrap-admin
                  optional: true
          readinessProbe:
            httpGet:
              path: /readyz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
          startupProbe:
            httpGet:
              path: /healthz
              port: 8080
            periodSeconds: 10
            failureThreshold: 18
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 250m
              memory: 256Mi
          volumeMounts:
            - mountPath: /etc/consize-gcp
              name: consize-gcp
      volumes:
        - name: consize-gcp
          secret:
            secretName: consize-gcp
---
apiVersion: v1
kind: Service
metadata:
  name: consize-api
  namespace: consize-system
spec:
  selector:
    app: consize-api
  ports:
    - port: 8080
      targetPort: 8080
