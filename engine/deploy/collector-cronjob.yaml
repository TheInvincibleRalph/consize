# Collector CronJob (ADR-011): every 15 minutes, ingest live k8s metadata,
# Prometheus usage, and configured live database metrics into usage_buckets.
# Runs with the read identity (consize-reader): list/watch the workloads it
# analyzes — never writes to the cluster.
#
# CONSIZE_NAMESPACES (ADR-025): optional collection scope. Leave it empty for
# cluster-wide discovery using the read-only ClusterRole in rbac.yaml. Set it
# to "team-a,team-b" only for namespace-scoped installations.
#
# PROMETHEUS_URL points at the cluster's kube-prometheus-stack; the
# ServiceMonitor CRDs already scrape kubelet/cadvisor, which is where
# the usage percentiles come from.
#
# CONSIZE_DBMETRICS=gcp reads live Cloud SQL metrics through the
# consize-gcp Secret. Do not set this to "fixture" in production.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: consize-collector
  namespace: consize-system
spec:
  schedule: "*/15 * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: consize-reader
          restartPolicy: OnFailure
          containers:
            - name: collector
              image: consize/collector:latest
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: consize-store
                      key: database-url
                - name: PROMETHEUS_URL
                  valueFrom:
                    secretKeyRef:
                      name: consize-store
                      key: prometheus-url
                # ADR-025: empty = cluster-wide read/discovery. Direct writes
                # are still constrained by per-namespace consize-apply
                # RoleBindings on the consize-writer identity.
                - name: CONSIZE_NAMESPACES
                  value: ""
                - name: CONSIZE_DBMETRICS
                  value: "gcp"
                - name: CONSIZE_GCP_PROJECT
                  value: "devops-portfolio-prod"
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /etc/consize-gcp/key.json
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - mountPath: /etc/consize-gcp
                  name: consize-gcp
          volumes:
            - name: consize-gcp
              secret:
                secretName: consize-gcp
