# Cloud-waste scan CronJob (ADR-047): finds non-workload cloud resources that
# still accrue cost and stores them as reviewable opportunities. It never
# deletes or mutates cloud resources directly; operators prepare Terraform PR
# plans from the persisted findings.
#
# CONSIZE_COSTSCAN selects the provider source. The live GKE demo uses "gcp"
# with the same service-account key mounted for the Cloud SQL collector.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: consize-costscan
  namespace: consize-system
spec:
  schedule: "0 7 * * *"
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        spec:
          restartPolicy: OnFailure
          serviceAccountName: consize-reader
          containers:
            - name: costscan
              image: consize/costscan:latest
              imagePullPolicy: IfNotPresent
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: consize-store
                      key: database-url
                - name: CONSIZE_COSTSCAN
                  value: "gcp"
                - name: CONSIZE_GCP_PROJECT
                  value: "devops-portfolio-prod"
                - name: GOOGLE_APPLICATION_CREDENTIALS
                  value: /etc/consize-gcp/key.json
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
              volumeMounts:
                - mountPath: /etc/consize-gcp
                  name: consize-gcp
          volumes:
            - name: consize-gcp
              secret:
                secretName: consize-gcp
