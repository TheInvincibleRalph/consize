# Verifier CronJob (ADR-018): find applied events whose
# verification window is due, compare SLIs, record the verdict, and
# roll back + alert on FAIL. Uses the write identity — rollback is a
# patch like any other (ADR-021).
#
# Env wiring:
#   DATABASE_URL / PROMETHEUS_URL from a Secret (example below)
#   CONSIZE_VERIFY_WINDOW   base window, default 1h
#   CONSIZE_SUSTAINED_MINUTES default 5
#   CONSIZE_SLI_ERROR_EXPR / CONSIZE_SLI_P99_EXPR  opt-in app-level SLIs
#   CONSIZE_ALERT_ROUTING   Grafana-style contact points + notification policies
#   CONSIZE_SLACK_WEBHOOK   legacy/default Slack contact point webhook
#
# Production verification starts with a 1-hour observation window and scales
# by step number: step 1 waits 1h, step 2 waits 2h, and so on. The CronJob
# runs every minute, so due applies are picked up automatically as soon as
# their safety window opens.
---
apiVersion: batch/v1
kind: CronJob
metadata:
  name: consize-verify
  namespace: consize-system
spec:
  schedule: "* * * * *"
  concurrencyPolicy: Forbid
  jobTemplate:
    spec:
      template:
        spec:
          serviceAccountName: consize-writer
          restartPolicy: OnFailure
          containers:
            - name: verify
              image: consize/verify:latest
              env:
                - name: DATABASE_URL
                  valueFrom:
                    secretKeyRef:
                      name: consize-store
                      key: database-url
                - name: PROMETHEUS_URL
                  valueFrom:
                    secretKeyRef:
                      name: consize-store
                      key: prometheus-url
                - name: CONSIZE_VERIFY_WINDOW
                  value: "1h"
                - name: CONSIZE_SUSTAINED_MINUTES
                  value: "5"
                # Grafana-style notification routing. Secrets stay in env vars
                # (from Kubernetes Secrets); routing JSON references them by
                # name. If this is omitted, CONSIZE_SLACK_WEBHOOK alone still
                # becomes the default Slack contact point.
                #
                # - name: CONSIZE_ALERT_ROUTING
                #   value: |
                #     {
                #       "default_contact_point": "ops-slack",
                #       "contact_points": [
                #         {
                #           "name": "ops-slack",
                #           "integrations": [
                #             {
                #               "type": "slack",
                #               "webhook_env": "CONSIZE_SLACK_WEBHOOK",
                #               "channel": "#platform-oncall",
                #               "mention": "<!subteam^S123456>"
                #             }
                #           ]
                #         }
                #       ],
                #       "notification_policies": [
                #         {
                #           "name": "critical-verification",
                #           "match": {
                #             "severity": "critical",
                #             "alertname": "ConsizeVerificationFailed"
                #           },
                #           "contact_point": "ops-slack"
                #         }
                #       ]
                #     }
                - name: CONSIZE_SLACK_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: consize-alerts
                      key: slack-webhook
                      optional: true
              resources:
                requests:
                  cpu: 50m
                  memory: 64Mi
                limits:
                  cpu: 250m
                  memory: 256Mi
