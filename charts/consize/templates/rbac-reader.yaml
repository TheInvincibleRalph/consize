{{- if .Values.rbac.create }}
{{- if and (empty .Values.collector.namespaces) .Values.rbac.reader.clusterWideWhenNamespacesEmpty }}
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ include "consize.fullname" . }}-read
  labels:
    {{- include "consize.componentLabels" (dict "root" . "component" "reader") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["namespaces", "pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ include "consize.fullname" . }}-read
  labels:
    {{- include "consize.componentLabels" (dict "root" . "component" "reader") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ include "consize.fullname" . }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "consize.readerServiceAccountName" . }}
    namespace: {{ include "consize.namespace" . }}
{{- else }}
{{- range $namespace := .Values.collector.namespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: {{ include "consize.fullname" $ }}-read
  namespace: {{ $namespace }}
  labels:
    {{- include "consize.componentLabels" (dict "root" $ "component" "reader") | nindent 4 }}
rules:
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["apps"]
    resources: ["deployments", "statefulsets", "daemonsets", "replicasets"]
    verbs: ["get", "list", "watch"]
  - apiGroups: ["batch"]
    resources: ["jobs", "cronjobs"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: {{ include "consize.fullname" $ }}-read
  namespace: {{ $namespace }}
  labels:
    {{- include "consize.componentLabels" (dict "root" $ "component" "reader") | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: {{ include "consize.fullname" $ }}-read
subjects:
  - kind: ServiceAccount
    name: {{ include "consize.readerServiceAccountName" $ }}
    namespace: {{ include "consize.namespace" $ }}
{{- end }}
{{- end }}
{{- end }}
