{{- if .Values.reports.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "consize.fullname" . }}-report
  namespace: {{ include "consize.namespace" . }}
  labels:
    {{- include "consize.componentLabels" (dict "root" . "component" "report") | nindent 4 }}
spec:
  schedule: {{ .Values.reports.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 1
      template:
        metadata:
          labels:
            {{- include "consize.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: report
          {{- with .Values.reports.podAnnotations }}
          annotations:
            {{- toYaml . | nindent 12 }}
          {{- end }}
        spec:
          serviceAccountName: {{ include "consize.readerServiceAccountName" . }}
          {{- with .Values.global.imagePullSecrets }}
          imagePullSecrets:
            {{- range . }}
            - name: {{ . | quote }}
            {{- end }}
          {{- end }}
          restartPolicy: Never
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: report
              image: {{ include "consize.image" (list . "report") | quote }}
              imagePullPolicy: {{ .Values.global.imagePullPolicy }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
              env:
                {{- include "consize.databaseEnv" . | nindent 16 }}
                {{- if .Values.slack.existingSecret }}
                - name: CONSIZE_SLACK_WEBHOOK
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.slack.existingSecret }}
                      key: {{ .Values.slack.key }}
                      optional: true
                {{- end }}
                {{- with .Values.reports.extraEnv }}
                {{- toYaml . | nindent 16 }}
                {{- end }}
              resources:
                {{- toYaml .Values.reports.resources | nindent 16 }}
{{- end }}
