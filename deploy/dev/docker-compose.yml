services:
  postgres:
    image: postgres:16-alpine
    container_name: consize-dev-postgres
    environment:
      POSTGRES_DB: app
      POSTGRES_USER: app
      POSTGRES_PASSWORD: consize
    ports:
      - "15432:5432"
    volumes:
      - consize-dev-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U app -d app"]
      interval: 5s
      timeout: 5s
      retries: 12

volumes:
  consize-dev-postgres:
